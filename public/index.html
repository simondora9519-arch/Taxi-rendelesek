<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Céges Rendelések – Taxi</title>
<style>
:root{--y:#f5b800;--yd:#d99f00;--dk:#2b2f36;--bg:#f4f5f7;--bd:#e1e3e8;--tx:#222;--mu:#6b7280}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
button{font:inherit;cursor:pointer}input,select,textarea{font:inherit;padding:10px;border:1px solid var(--bd);border-radius:8px;width:100%;background:#fff}
.btn{background:var(--y);border:0;border-radius:8px;padding:10px 16px;font-weight:600;color:#222}.btn:hover{background:var(--yd)}
.btn.sec{background:#fff;border:1px solid var(--bd)}.btn.red{background:#e5484d;color:#fff}.btn.sm{padding:6px 10px;font-size:14px}
.hidden{display:none!important}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:14px;box-shadow:0 4px 20px #0001;padding:28px;width:100%;max-width:380px}
.card h1{margin:0 0 4px;font-size:22px}.card p{color:var(--mu);margin:0 0 20px}
.field{margin-bottom:14px}.field label{display:block;font-size:14px;margin-bottom:5px;font-weight:600}
.chk{display:flex;gap:8px;align-items:center;margin-bottom:16px}.chk input{width:auto}
.err{color:#c62828;font-size:14px;min-height:18px;margin-bottom:8px}
/* layout */
header{height:58px;background:var(--dk);color:#fff;display:flex;align-items:center;padding:0 16px;gap:12px;position:sticky;top:0;z-index:20;border-bottom:4px solid var(--y)}
header .logo{font-weight:700;font-size:18px}header .logo span{color:var(--y)}
header .sp{flex:1}header .user{font-size:14px;opacity:.85}
#menuBtn{display:none;background:none;border:0;color:#fff;font-size:24px}
header .btn{padding:7px 12px;font-size:14px}
#app{display:flex;min-height:calc(100vh - 58px)}
nav{width:260px;background:#fff;border-right:1px solid var(--bd);overflow-y:auto;height:calc(100vh - 58px);position:sticky;top:58px;flex-shrink:0;display:flex;flex-direction:column}
#tree{flex:1;padding:8px}
.yr>button,.mo>button{width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:8px;display:flex;align-items:center;gap:6px}
.yr>button{font-weight:700;font-size:16px}.mo>button{padding-left:22px}
.yr>button:hover,.mo>button:hover{background:var(--bg)}
.arr{display:inline-block;width:14px;transition:transform .15s;color:var(--mu)}.open>button .arr{transform:rotate(90deg)}
.kids{display:none}.open>.kids{display:block}
.days a{display:flex;justify-content:space-between;padding:6px 10px 6px 44px;color:var(--tx);text-decoration:none;font-size:14px;border-radius:6px}
.days a:hover{background:var(--bg)}.days a.act{background:var(--y);font-weight:600}
.days a.we{color:#b45309}.days a .n{background:var(--dk);color:#fff;border-radius:10px;font-size:11px;padding:1px 7px}
.days a.today{outline:2px solid var(--y)}
.navfoot{padding:10px;border-top:1px solid var(--bd);display:grid;gap:8px}
main{flex:1;padding:22px;min-width:0}
h2{margin:0 0 4px}.sub{color:var(--mu);margin:0 0 18px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px #0001}
th,td{padding:10px;text-align:left;border-bottom:1px solid var(--bd);font-size:14px;vertical-align:top}
th{background:#fafafa;font-size:13px;color:var(--mu);text-transform:uppercase;letter-spacing:.02em}
td.t{font-weight:700;font-size:16px}.pay{padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600;white-space:nowrap}
.pay.Készpénz{background:#dcfce7}.pay.Bankkártya{background:#dbeafe}.pay.Utalás{background:#fef3c7}
.empty{background:#fff;padding:40px;text-align:center;color:var(--mu);border-radius:12px}
.cards{display:none}
.oc{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 1px 4px #0001;border-left:5px solid var(--y)}
.oc .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.oc .h b{font-size:20px}
.oc div.r{font-size:14px;margin:3px 0}.oc .lb{color:var(--mu)}
.welcome{background:#fff;border-radius:12px;padding:30px}
/* modal */
.ov{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
.modal{background:#fff;border-radius:14px;width:100%;max-width:560px;max-height:94vh;overflow-y:auto;padding:22px}
.modal h3{margin:0 0 16px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--dk);color:#fff;padding:10px 18px;border-radius:8px;z-index:60}
.meta{font-size:12px;color:var(--mu)}
@media(max-width:820px){
 #menuBtn{display:block}header .user{display:none}
 nav{position:fixed;left:0;top:58px;z-index:30;transform:translateX(-100%);transition:transform .2s;box-shadow:4px 0 20px #0002}
 nav.show{transform:none}
 main{padding:14px}table{display:none}.cards{display:block}
 .grid2{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div id="login" class="hidden">
 <form class="card" id="loginForm" autocomplete="on">
  <h1>🚕 Céges Rendelések</h1><p>Jelentkezzen be a folytatáshoz</p>
  <div class="field"><label for="lu">Felhasználónév</label><input id="lu" name="username" autocomplete="username" required></div>
  <div class="field"><label for="lp">Jelszó</label><input id="lp" name="password" type="password" autocomplete="current-password" required></div>
  <label class="chk"><input type="checkbox" id="lr" checked> Emlékezzen rám (30 napig)</label>
  <div class="err" id="lerr"></div>
  <button class="btn" style="width:100%">Belépés</button>
 </form>
</div>

<div id="main" class="hidden">
 <header>
  <button id="menuBtn" aria-label="Menü">☰</button>
  <div class="logo">🚕 Céges <span>Rendelések</span></div>
  <div class="sp"></div>
  <div class="user" id="uname"></div>
  <button class="btn sec" id="logout">Kijelentkezés</button>
 </header>
 <div id="app">
  <nav id="nav">
   <div id="tree"></div>
   <div class="navfoot">
    <button class="btn" id="addYear">+ Új év</button>
    <button class="btn sec sm" id="pwBtn">Jelszó módosítása</button>
    <button class="btn sec sm hidden" id="usersBtn">Felhasználók kezelése</button>
   </div>
  </nav>
  <main id="content"></main>
 </div>
</div>
<div id="modalRoot"></div>

<script>
const HU_M=['Január','Február','Március','Április','Május','Június','Július','Augusztus','Szeptember','Október','November','December'];
const HU_D=['vasárnap','hétfő','kedd','szerda','csütörtök','péntek','szombat'];
const PAY=['Készpénz','Bankkártya','Utalás'];
let me=null,years=[],counts={},openState=JSON.parse(localStorage.getItem('open')||'{}'),es=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=(y,m,d)=>`${y}-${pad(m)}-${pad(d)}`;
const huDate=s=>{if(!s)return'';const[y,m,d]=s.split('-');return`${y}.${m}.${d}.`};
function todayBp(){return new Date().toLocaleDateString('sv-SE',{timeZone:'Europe/Budapest'})}
function dow(s){const[y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d)).getUTCDay()}
function dim(y,m){return new Date(Date.UTC(y,m,0)).getUTCDate()}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2500)}

async function api(url,opt={}){
 const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json'},body:opt.body?JSON.stringify(opt.body):undefined});
 const j=await r.json().catch(()=>({}));
 if(r.status===401&&!url.includes('login')){showLogin();throw new Error('auth')}
 if(!r.ok)throw new Error(j.error||'Hiba');return j;
}

function showLogin(){$('#main').classList.add('hidden');$('#login').classList.remove('hidden');if(es){es.close();es=null}}
$('#loginForm').onsubmit=async e=>{
 e.preventDefault();$('#lerr').textContent='';
 try{await api('/api/login',{method:'POST',body:{username:$('#lu').value,password:$('#lp').value,remember:$('#lr').checked}});
  if(window.PasswordCredential){try{navigator.credentials.store(new PasswordCredential(e.target))}catch(_){}}
  start();}catch(err){$('#lerr').textContent=err.message}
};
$('#logout').onclick=async()=>{await fetch('/api/logout');showLogin()};
$('#menuBtn').onclick=()=>$('#nav').classList.toggle('show');

async function start(){
 try{me=await api('/api/me')}catch(e){return}
 $('#login').classList.add('hidden');$('#main').classList.remove('hidden');
 $('#uname').textContent='👤 '+me.name;$('#usersBtn').classList.toggle('hidden',!me.admin);
 await loadYears();route();
 es=new EventSource('/api/events');
 es.onmessage=async ev=>{const d=JSON.parse(ev.data);await loadYears();
  if(d.type==='orders'&&currentDate()===d.date)loadDay(d.date,true)};
}

async function loadYears(){const r=await api('/api/years');years=r.years;counts=r.counts;renderTree()}
function saveOpen(){localStorage.setItem('open',JSON.stringify(openState))}

function renderTree(){
 const cur=currentDate(),today=todayBp();
 if(cur){const[y,m]=cur.split('-');openState['y'+Number(y)]=true;openState['m'+Number(y)+'-'+Number(m)]=true}
 let h='';
 for(const y of years){
  h+=`<div class="yr ${openState['y'+y]?'open':''}" data-k="y${y}"><button><span class="arr">▶</span>${y}</button><div class="kids">`;
  for(let m=1;m<=12;m++){
   let mc=0,dh='';
   for(let d=1;d<=dim(y,m);d++){const s=iso(y,m,d),c=counts[s]||0;mc+=c;const w=dow(s);
    dh+=`<a href="#/${s}" class="${s===cur?'act':''} ${w===0||w===6?'we':''} ${s===today?'today':''}"><span>${y}.${pad(m)}.${pad(d)}. ${HU_D[w].slice(0,3)}</span>${c?`<span class="n">${c}</span>`:''}</a>`}
   h+=`<div class="mo ${openState['m'+y+'-'+m]?'open':''}" data-k="m${y}-${m}"><button><span class="arr">▶</span>${HU_M[m-1]}${mc?` <span class="meta">(${mc})</span>`:''}</button><div class="kids days">${dh}</div></div>`;
  }
  h+='</div></div>';
 }
 $('#tree').innerHTML=h;
 $('#tree').querySelectorAll('.yr>button,.mo>button').forEach(b=>b.onclick=()=>{const p=b.parentElement;p.classList.toggle('open');openState[p.dataset.k]=p.classList.contains('open');saveOpen()});
 $('#tree').querySelectorAll('.days a').forEach(a=>a.onclick=()=>$('#nav').classList.remove('show'));
 const act=$('#tree .act');if(act&&!renderTree.scrolled){act.scrollIntoView({block:'center'});renderTree.scrolled=true}
}

function currentDate(){const m=location.hash.match(/^#\/(\d{4}-\d{2}-\d{2})$/);return m?m[1]:null}
window.onhashchange=()=>{renderTree();route()};
function route(){const d=currentDate();if(d)loadDay(d);else welcome()}

function welcome(){
 const t=todayBp();
 $('#content').innerHTML=`<div class="welcome"><h2>Üdvözöljük, ${esc(me.name)}!</h2><p class="sub">Mai dátum (Budapest): ${huDate(t)} ${HU_D[dow(t)]}</p>
 <p>Válasszon egy dátumot a bal oldali menüből (évszám → hónap → nap), vagy ugorjon közvetlenül egy napra:</p>
 <div class="bar"><input type="date" id="jump" style="max-width:220px" value="${years.includes(+t.slice(0,4))?t:years[0]+'-01-01'}"><button class="btn" id="jumpBtn">Megnyitás</button></div></div>`;
 $('#jumpBtn').onclick=()=>{const v=$('#jump').value;if(v)location.hash='#/'+v};
}

let dayOrders=[];
async function loadDay(d,silent){
 if(!silent)$('#content').innerHTML='<p class="sub">Betöltés…</p>';
 dayOrders=await api('/api/orders?date='+d);
 const [y,m,dd]=d.split('-').map(Number);
 const prev=new Date(Date.UTC(y,m-1,dd-1)).toISOString().slice(0,10),next=new Date(Date.UTC(y,m-1,dd+1)).toISOString().slice(0,10);
 let rows='',cards='';
 for(const o of dayOrders){
  rows+=`<tr><td class="t">${esc(o.time)}</td><td>${esc(o.from)}</td><td>${esc(o.to)}</td><td>${huDate(o.orderedOn)}</td><td>${esc(o.orderedBy)}</td><td>${esc(o.company)}</td><td><span class="pay ${esc(o.payment)}">${esc(o.payment)}</span></td><td>${esc(o.note)}</td>
  <td style="white-space:nowrap"><button class="btn sec sm" data-e="${o.id}">✏️</button> <button class="btn sec sm" data-d="${o.id}">🗑️</button></td></tr>`;
  cards+=`<div class="oc"><div class="h"><b>${esc(o.time)}</b><span class="pay ${esc(o.payment)}">${esc(o.payment)}</span></div>
  <div class="r">📍 <b>${esc(o.from)}</b> → <b>${esc(o.to)}</b></div>
  ${o.company?`<div class="r"><span class="lb">Cég:</span> ${esc(o.company)}</div>`:''}
  ${o.orderedBy?`<div class="r"><span class="lb">Leadta:</span> ${esc(o.orderedBy)}${o.orderedOn?' ('+huDate(o.orderedOn)+')':''}</div>`:''}
  ${o.note?`<div class="r"><span class="lb">Megjegyzés:</span> ${esc(o.note)}</div>`:''}
  <div class="mact"><button class="btn sec sm" data-e="${o.id}">✏️ Szerkesztés</button><button class="btn sec sm" data-d="${o.id}">🗑️ Törlés</button></div></div>`;
 }
 $('#content').innerHTML=`<h2>${y}. ${HU_M[m-1].toLowerCase()} ${dd}. – ${HU_D[dow(d)]}</h2><p class="sub">${dayOrders.length} rendelés</p>
 <div class="bar"><button class="btn" id="newO">+ Új rendelés</button><span class="sp" style="flex:1"></span>
 <a class="btn sec sm" href="#/${prev}">‹ Előző nap</a><a class="btn sec sm" href="#/${next}">Következő nap ›</a></div>
 ${dayOrders.length?`<table><thead><tr><th>Időpont</th><th>Indulás</th><th>Érkezés</th><th>Rendelés dátuma</th><th>Leadta</th><th>Cég</th><th>Fizetés</th><th>Megjegyzés</th><th></th></tr></thead><tbody>${rows}</tbody></table><div class="cards">${cards}</div>`
 :'<div class="empty">Erre a napra még nincs rendelés.<br><br>Kattintson az „+ Új rendelés” gombra.</div>'}`;
 $('#newO').onclick=()=>orderForm(d);
 $('#content').querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>orderForm(d,dayOrders.find(o=>o.id===b.dataset.e)));
 $('#content').querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{const o=dayOrders.find(x=>x.id===b.dataset.d);
  if(confirm(`Biztosan törli a(z) ${o.time} rendelést (${o.from} → ${o.to})?`)){await api('/api/orders/'+o.id,{method:'DELETE'});toast('Törölve');loadYears();loadDay(d,true)}});
}

function modal(html){$('#modalRoot').innerHTML=`<div class="ov"><div class="modal">${html}</div></div>`;
 const ov=$('#modalRoot .ov');ov.onclick=e=>{if(e.target===ov)closeModal()};return ov}
function closeModal(){$('#modalRoot').innerHTML=''}

function orderForm(date,o){
 o=o||{date,time:'',from:'',to:'',orderedOn:todayBp(),orderedBy:'',company:'',payment:'',note:''};
 const [hh,mm]=(o.time||':').split(':');
 let hOpt='<option value="">óra</option>',mOpt='<option value="">perc</option>';
 for(let i=0;i<24;i++)hOpt+=`<option ${pad(i)===hh?'selected':''}>${pad(i)}</option>`;
 for(let i=0;i<60;i+=5)mOpt+=`<option ${pad(i)===mm?'selected':''}>${pad(i)}</option>`;
 if(mm&&+mm%5)mOpt+=`<option selected>${mm}</option>`;
 modal(`<h3>${o.id?'Rendelés szerkesztése':'Új rendelés'} – ${huDate(date)}</h3>
 <form id="of">
 <div class="grid2"><div class="field"><label>Időpont *</label><div style="display:flex;gap:6px"><select id="fh" required>${hOpt}</select><select id="fm" required>${mOpt}</select></div></div>
 <div class="field"><label>Utazás napja</label><input type="date" id="fdate" value="${esc(o.date)}" required></div></div>
 <div class="field"><label>Kiinduló helyszín *</label><input id="ffrom" value="${esc(o.from)}" required></div>
 <div class="field"><label>Érkezési helyszín *</label><input id="fto" value="${esc(o.to)}" required></div>
 <div class="grid2"><div class="field"><label>Rendelés leadásának dátuma</label><input type="date" id="fon" value="${esc(o.orderedOn)}"></div>
 <div class="field"><label>Ki adta le</label><input id="fby" value="${esc(o.orderedBy)}"></div></div>
 <div class="grid2"><div class="field"><label>Cég</label><input id="fco" value="${esc(o.company)}" list="cos"></div>
 <div class="field"><label>Fizetés módja *</label><select id="fpay" required><option value="">– válasszon –</option>${PAY.map(p=>`<option ${p===o.payment?'selected':''}>${p}</option>`).join('')}</select></div></div>
 <div class="field"><label>Megjegyzés</label><textarea id="fnote" rows="2" maxlength="500">${esc(o.note)}</textarea></div>
 ${o.createdBy?`<p class="meta">Rögzítette: ${esc(o.createdBy)} (${esc(o.createdAt?.replace('T',' ').slice(0,16))})${o.updatedBy?` · Módosította: ${esc(o.updatedBy)} (${esc(o.updatedAt.replace('T',' ').slice(0,16))})`:''}</p>`:''}
 <div class="err" id="ferr"></div>
 <div class="mact"><button type="button" class="btn sec" id="fc">Mégse</button><button class="btn">Mentés</button></div></form>`);
 $('#fc').onclick=closeModal;
 $('#of').onsubmit=async e=>{e.preventDefault();
  const b={date:$('#fdate').value,time:$('#fh').value+':'+$('#fm').value,from:$('#ffrom').value,to:$('#fto').value,orderedOn:$('#fon').value,orderedBy:$('#fby').value,company:$('#fco').value,payment:$('#fpay').value,note:$('#fnote').value};
  try{await api(o.id?'/api/orders/'+o.id:'/api/orders',{method:o.id?'PUT':'POST',body:b});closeModal();toast('Mentve');await loadYears();
   if(b.date!==date)location.hash='#/'+b.date;else loadDay(date,true)}catch(err){$('#ferr').textContent=err.message}};
}

$('#addYear').onclick=()=>{
 const sug=Math.max(...years)+1;
 modal(`<h3>Új év hozzáadása</h3><p class="sub">A hónapok és napok automatikusan létrejönnek a naptár szerint.</p>
 <form id="yf"><div class="field"><label>Év</label><input type="number" id="yv" min="2000" max="2100" value="${sug}" required></div>
 <div class="err" id="yerr"></div><div class="mact"><button type="button" class="btn sec" id="yc">Mégse</button><button class="btn">Hozzáadás</button></div></form>`);
 $('#yc').onclick=closeModal;
 $('#yf').onsubmit=async e=>{e.preventDefault();try{const y=+$('#yv').value;await api('/api/years',{method:'POST',body:{year:y}});openState['y'+y]=true;saveOpen();closeModal();await loadYears();toast(y+' hozzáadva')}catch(err){$('#yerr').textContent=err.message}};
};

$('#pwBtn').onclick=()=>{
 modal(`<h3>Jelszó módosítása</h3><form id="pf"><div class="field"><label>Jelenlegi jelszó</label><input type="password" id="p1" autocomplete="current-password" required></div>
 <div class="field"><label>Új jelszó (min. 6 karakter)</label><input type="password" id="p2" autocomplete="new-password" required></div>
 <div class="err" id="perr"></div><div class="mact"><button type="button" class="btn sec" id="pc">Mégse</button><button class="btn">Mentés</button></div></form>`);
 $('#pc').onclick=closeModal;
 $('#pf').onsubmit=async e=>{e.preventDefault();try{await api('/api/password',{method:'POST',body:{old:$('#p1').value,new:$('#p2').value}});closeModal();toast('Jelszó módosítva')}catch(err){$('#perr').textContent=err.message}};
};

$('#usersBtn').onclick=async()=>{
 const us=await api('/api/users');
 modal(`<h3>Felhasználók kezelése</h3>
 <table style="display:table;margin-bottom:16px"><tr><th>Felhasználó</th><th>Név</th><th></th></tr>
 ${us.map(u=>`<tr><td>${esc(u.username)}${u.admin?' <span class="meta">(admin)</span>':''}</td><td>${esc(u.name)}</td><td>${u.username!==me.username?`<button class="btn sec sm" data-u="${esc(u.username)}">🗑️</button>`:''}</td></tr>`).join('')}</table>
 <p class="meta">Új felhasználó felvétele (meglévő név esetén a jelszó felülíródik):</p>
 <form id="uf"><div class="grid2"><div class="field"><label>Felhasználónév</label><input id="un" required></div><div class="field"><label>Teljes név</label><input id="unm"></div></div>
 <div class="field"><label>Jelszó</label><input id="upw" type="text" required></div>
 <label class="chk"><input type="checkbox" id="uad"> Adminisztrátor (felhasználókat kezelhet)</label>
 <div class="err" id="uerr"></div><div class="mact"><button type="button" class="btn sec" id="uc">Bezárás</button><button class="btn">Mentés</button></div></form>`);
 $('#uc').onclick=closeModal;
 document.querySelectorAll('[data-u]').forEach(b=>b.onclick=async()=>{if(confirm('Törli: '+b.dataset.u+'?')){await api('/api/users/'+encodeURIComponent(b.dataset.u),{method:'DELETE'});$('#usersBtn').click()}});
 $('#uf').onsubmit=async e=>{e.preventDefault();try{await api('/api/users',{method:'POST',body:{username:$('#un').value,name:$('#unm').value,password:$('#upw').value,admin:$('#uad').checked}});toast('Felhasználó mentve');$('#usersBtn').click()}catch(err){$('#uerr').textContent=err.message}};
};

start().catch(()=>{});
fetch('/api/me').then(r=>{if(r.status===401)showLogin()});
</script>
</body>
</html>
