<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Céges Rendelések</title>
<style>
:root{--y:#f5b800;--yd:#d99f00;--dk:#2b2f36;--bg:#f4f5f7;--bd:#e1e3e8;--mu:#6b7280;--mod:#9aa1ab}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:#222}
button{font:inherit;cursor:pointer}input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;width:100%;background:#fff;color:inherit}
.btn{background:var(--y);border:0;border-radius:8px;padding:9px 15px;font-weight:600;color:#222}.btn:hover{background:var(--yd)}
.btn.sec{background:#fff;border:1px solid var(--bd)}.btn.sm{padding:5px 9px;font-size:13px}.btn.red{background:#e5484d;color:#fff}
.hidden{display:none!important}.sp{flex:1}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:14px;box-shadow:0 4px 20px #0001;padding:26px;width:100%;max-width:380px}
.card h1{margin:0 0 4px;font-size:21px}.card p{color:var(--mu);margin:0 0 18px}
.field{margin-bottom:12px}.field label{display:block;font-size:13px;margin-bottom:4px;font-weight:600}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;margin-bottom:14px}.chk input{width:auto}
.err{color:#c62828;font-size:14px;min-height:18px;margin-bottom:6px}
.ok{color:#1b7f3b;font-size:14px}
/* layout */
header{height:56px;background:var(--dk);color:#fff;display:flex;align-items:center;padding:0 14px;gap:10px;position:sticky;top:0;z-index:20;border-bottom:4px solid var(--y)}
header .logo{font-weight:700}header .logo span{color:var(--y)}
header .navb{background:none;border:0;color:#fff;font-size:15px;padding:6px 8px;border-radius:6px}header .navb:hover{background:#ffffff22}
#menuBtn{display:none;background:none;border:0;color:#fff;font-size:22px}
#app{display:flex;min-height:calc(100vh - 56px)}
nav{width:250px;background:#fff;border-right:1px solid var(--bd);overflow-y:auto;height:calc(100vh - 56px);position:sticky;top:56px;flex-shrink:0;display:flex;flex-direction:column}
#tree{flex:1;padding:6px}
.yr>button,.mo>button{width:100%;text-align:left;background:none;border:0;padding:8px 9px;border-radius:8px;display:flex;align-items:center;gap:5px}
.yr>button{font-weight:700}.mo>button{padding-left:20px}
.yr>button:hover,.mo>button:hover{background:var(--bg)}
.arr{display:inline-block;width:12px;transition:transform .15s;color:var(--mu)}.open>button .arr{transform:rotate(90deg)}
.kids{display:none}.open>.kids{display:block}
a.day{display:flex;justify-content:space-between;padding:5px 9px 5px 40px;color:#222;text-decoration:none;font-size:13px;border-radius:6px}
a.day:hover{background:var(--bg)}a.day.act{background:var(--y);font-weight:700}
a.day.we{color:#b45309}a.day .n{background:var(--dk);color:#fff;border-radius:9px;font-size:11px;padding:0 6px}
.navfoot{padding:9px;border-top:1px solid var(--bd);display:grid;gap:7px}
main{flex:1;padding:18px;min-width:0}
h2{margin:0 0 3px;font-size:21px}.sub{color:var(--mu);margin:0 0 14px;font-size:14px}
.bar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
/* compact sorok */
.rows{display:grid;gap:6px}
.row{background:#fff;border-radius:9px;box-shadow:0 1px 3px #0001;display:grid;grid-template-columns:64px 78px 110px minmax(150px,1fr) minmax(150px,1.1fr) auto;gap:10px;align-items:center;padding:7px 10px;font-size:14px;border-left:4px solid transparent}
.row.note{grid-template-columns:64px 1fr auto;background:#fffdf3;border-left-color:var(--bd);font-style:italic}
.row .tm{font-weight:700;font-size:16px}.row .tm .ann{font-size:12px;display:block;color:var(--mu);font-weight:400}
.tx{text-align:center;font-size:13px;color:#333;cursor:pointer;user-select:none}
.tx b{display:block;font-weight:400;font-size:15px}.tx.b b{font-weight:800}
.pay{display:inline-block;padding:2px 7px;border-radius:9px;font-size:12px;font-weight:600;white-space:nowrap;background:#eee}
.pay.Készpénz{background:#dcfce7}.pay.Bankkártya{background:#dbeafe}.pay.Utalás{background:#fef3c7}
.pay.Amex{background:#e0e7ff}.pay.Menetlevél{background:#f5d0fe}.pay.WBS{background:#ccfbf1}
.rt{line-height:1.35}.rt .st{display:block;color:#444;font-size:13px}.rt .tg{color:var(--mu)}
.nm b{font-weight:800;display:block;font-size:14px}.nm span{font-size:12px;color:var(--mu);display:block}
.f.mod,.m{color:var(--mod)!important}
.ck{display:flex;gap:6px;align-items:center;white-space:nowrap;flex-wrap:wrap;justify-content:flex-end}
.ck label{font-size:12px;display:flex;gap:4px;align-items:center}.ck input{width:auto}
.bell{background:none;border:0;font-size:15px;padding:2px 4px}.bell.on{filter:none}.bell.off{opacity:.3}
.empty{background:#fff;padding:34px;text-align:center;color:var(--mu);border-radius:12px}
.noteTop{background:#fffbe6;border:1px solid #f5e6a8;border-radius:10px;padding:11px 13px;margin-bottom:12px;font-size:14px}
.noteTop b{display:block;font-size:13px;color:#8a6d00}
/* modal */
.ov{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;z-index:50;padding:10px}
.modal{background:#fff;border-radius:14px;width:100%;max-width:680px;max-height:94vh;overflow-y:auto;padding:20px}
.modal h3{margin:0 0 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
.mact{display:flex;gap:7px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.hist{background:#fafafa;border:1px dashed var(--bd);border-radius:8px;padding:8px;margin-top:5px;font-size:13px}
.hist b{font-size:12px;color:var(--mu);display:block}
.hist .he{margin-top:3px}.hist .he i{color:var(--mu);font-style:normal;font-size:12px;display:block}
.hist.mods{margin-top:2px;background:#fff8e6;border-color:#f0d99a}
.histbox,.err,.field.histbox{margin-top:6px}
.mm{display:block;font-size:12px;color:#8a6d00}
.row{cursor:pointer}.row .ck label,.row .ck button,.row .tx{cursor:default}
.row .ck label{cursor:pointer}
.mini{font-size:12px;color:var(--mu)}a.add{font-size:13px;color:#0b6bcb;cursor:pointer;display:inline-block;margin-top:4px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--dk);color:#fff;padding:9px 16px;border-radius:8px;z-index:60;font-size:14px}
.toast.alert{background:#c62828;font-size:16px;padding:14px 22px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--bd);border-radius:20px;padding:4px 8px;margin:0 5px 5px 0;font-size:13px}
.sw{width:18px;height:18px;border-radius:4px;border:1px solid #0002;display:inline-block}
.tbl{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden}
.tbl th,.tbl td{padding:8px;text-align:left;border-bottom:1px solid var(--bd);font-size:13px}
.tbl th{background:#fafafa;color:var(--mu);font-size:12px}
@media(max-width:900px){
 #menuBtn{display:block}header .navb{display:none}
 nav{position:fixed;left:0;top:56px;z-index:30;transform:translateX(-100%);transition:transform .2s;box-shadow:4px 0 20px #0002}nav.show{transform:none}
 main{padding:12px}
 .row{grid-template-columns:56px 62px 1fr;grid-template-areas:"tm tx pay" "rt rt rt" "nm nm nm" "ck ck ck";gap:6px}
 .row .tm{grid-area:tm}.row .tx{grid-area:tx}.row .pw{grid-area:pay}.row .rt{grid-area:rt}.row .nm{grid-area:nm}.row .ck{grid-area:ck;justify-content:flex-start}
 .row.note{grid-template-areas:"tm tm" "nt nt" "ck ck";grid-template-columns:56px 1fr}
 .grid2,.grid3{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="login" class="hidden">
 <form class="card" id="lf" autocomplete="on">
  <h1>🚕 Céges Rendelések</h1><p>Jelentkezzen be a folytatáshoz</p>
  <div class="field"><label for="lu">Felhasználónév</label><input id="lu" name="username" autocomplete="username" required></div>
  <div class="field"><label for="lp">Jelszó</label><input id="lp" name="password" type="password" autocomplete="current-password" required></div>
  <label class="chk"><input type="checkbox" id="lr" checked> Emlékezzen rám</label>
  <div class="err" id="lerr"></div><div class="ok" id="lok"></div>
  <button class="btn" style="width:100%">Belépés</button>
  <p style="margin:12px 0 0;text-align:center"><a href="#" id="forgot" style="font-size:13px">Elfelejtett jelszó</a></p>
 </form>
</div>
<div id="main" class="hidden">
 <header>
  <button id="menuBtn">☰</button>
  <div class="logo">🚕 Céges <span>Rendelések</span></div>
  <div class="sp"></div>
  <button class="navb" id="goSearch">🔍 Kereső</button>
  <button class="navb" id="goNotes">📝 Infók</button>
  <button class="navb" id="goSet">⚙️ Beállítások</button>
  <button class="btn sec" id="logout">Kilépés</button>
 </header>
 <div id="app">
  <nav id="nav"><div id="tree"></div>
   <div class="navfoot"><button class="btn" id="addYear">+ Új év</button></div>
  </nav>
  <main id="content"></main>
 </div>
</div>
<div id="modalRoot"></div>
<script>
window.onerror=function(m,src,l,c,err){try{authFatal(((err&&err.message)||m)+'\n'+(src||'')+' :'+(l||''))}catch(_){}};
window.addEventListener('unhandledrejection',function(e){try{authFatal('Hálózati/háttérfolyamat hiba: '+((e.reason&&e.reason.message)||e.reason))}catch(_){}});
function authFatal(msg){
 if(document.getElementById('fatal'))return;
 var d=document.createElement('div');d.setAttribute('id','fatal');
 d.style.cssText='position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:3px solid #e5484d;z-index:9999;padding:14px 18px;max-height:45vh;overflow:auto;font-family:system-ui,sans-serif;box-shadow:0 -4px 20px #0002';
 d.innerHTML='<h2 style="margin:0 0 6px;font-size:16px;color:#c62828">Hiba történt</h2>'
  +'<p style="color:#666;margin:0 0 8px;font-size:13px">A lap többi része használható. Másolja ki az alábbi szöveget, és küldje el:</p>'
  +'<pre style="background:#f6f6f6;border:1px solid #ddd;border-radius:8px;padding:12px;white-space:pre-wrap;font-size:13px">'+String(msg).replace(/[<>&]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c]})+'</pre>'
  +'<button onclick="location.reload()" style="padding:9px 16px;border:0;border-radius:8px;background:#f5b800;font-weight:600;cursor:pointer">Újratöltés</button>';
 document.body.appendChild(d);
}
const HU_M=['Január','Február','Március','Április','Május','Június','Július','Augusztus','Szeptember','Október','November','December'];
const HU_D=['vasárnap','hétfő','kedd','szerda','csütörtök','péntek','szombat'];
const PAY=['Készpénz','Bankkártya','Utalás','Amex','Menetlevél','WBS'];
const FIELD_LABELS={time:'Időpont',from:'Kiinduló helyszín',to:'Érkezési helyszín',stops:'Megállók',passengers:'Utas neve',payment:'Fizetési mód',note:'Megjegyzés',driver:'Taxiszám (tx)',colorId:'Szín',company:'Cég',orderedBy:'Leadta',orderedOn:'Leadás dátuma'};
let me=null,settings=null,years=[],counts={},notesC={},es=null,alarms={},openState=JSON.parse(localStorage.getItem('open')||'{}');
const $=s=>document.querySelector(s);
function say(sel,txt){const e=document.querySelector(sel);if(e)e.textContent=txt;return !!e;}
function setVal(sel,v){const e=document.querySelector(sel);if(e)e.value=v;return !!e;}
function isChecked(sel){const e=document.querySelector(sel);return !!(e&&e.checked);}
function getVal(sel){const e=document.querySelector(sel);return e?e.value:'';}
function show(el,on){const e=typeof el==='string'?document.querySelector(el):el;if(e)e.classList.toggle('hidden',!on);}
function q(id){return document.getElementById(id)}
function hide(sel,on){const e=q(sel)||document.querySelector(sel);if(e)e.classList.toggle('hidden',!on);return !!e}
function fmtTime(v){v=String(v||'');const m=v.match(/^(\d{1,2}):(\d{2})$/);return m?(pad(Math.min(23,+m[1]))+':'+m[2]):''}
function mark(m){return m?' m':''}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0'),iso=(y,m,d)=>`${y}-${pad(m)}-${pad(d)}`;
const hu=s=>s?s.split('-').reverse().join('.'):'';
const todayBp=()=>new Date().toLocaleDateString('sv-SE',{timeZone:'Europe/Budapest'});
const nowBp=()=>new Date(new Date().toLocaleString('en-US',{timeZone:'Europe/Budapest'}));
const dow=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(Date.UTC(a,b-1,c)).getUTCDay()};
const dim=(y,m)=>new Date(Date.UTC(y,m,0)).getUTCDate();
function toast(t,alert){const e=document.createElement('div');e.className='toast'+(alert?' alert':'');e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),alert?12000:2500)}
function closeModal(){const r=q('modalRoot');if(r)r.innerHTML=''}
function modal(html){const r=q('modalRoot');if(!r)return;r.innerHTML=`<div class="ov"><div class="modal">${html}</div></div>`;const o=r.querySelector('.ov');if(o)o.onclick=e=>{if(e.target===o)closeModal()}}
async function api(u,o={}){const r=await fetch(u,{...o,headers:{'Content-Type':'application/json'},body:o.body?JSON.stringify(o.body):undefined});
 if(r.status===401&&!u.includes('/login')){showLogin();throw new Error('auth')}
 const j=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error(j.error||('Hiba ('+r.status+')'));return j}
function showLogin(msg){
 show('#main',false);show('#login',true);
 if(es){es.close();es=null}
 if(msg==='expired')say('#lerr','Lejárt a bejelentkezés. Kérjük, lépjen be újra.');
}

$('#lf').onsubmit=async e=>{e.preventDefault();say('#lerr','');say('#lok','');
 try{await api('/api/login',{method:'POST',body:{username:getVal('#lu'),password:getVal('#lp'),remember:isChecked('#lr')}});
  if(window.PasswordCredential){try{await navigator.credentials.store(new PasswordCredential(e.target))}catch(_){}}
  start()}catch(err){say('#lerr',err.message)}};
 const fg=q('forgot');if(fg)fg.onclick=async e=>{e.preventDefault();const u=prompt('Felhasználónév:');if(!u)return;
 try{const r=await api('/api/forgot',{method:'POST',body:{username:u}});say('#lok',r.message)}catch(err){say('#lerr',err.message)}};
 const lo=q('logout');if(lo)lo.onclick=async()=>{try{await fetch('/api/logout')}catch(e){}showLogin()};
$('#menuBtn').onclick=()=>{const nv=document.getElementById('nav');if(nv)nv.classList.toggle('show')};
const _goSearch=q('goSearch');if(_goSearch)_goSearch.onclick=()=>{location.hash='#/search';route()};
const _goNotes=q('goNotes');if(_goNotes)_goNotes.onclick=()=>{location.hash='#/notes';route()};
const _goSet=q('goSet');if(_goSet)_goSet.onclick=()=>{location.hash='#/settings';route()};

if(location.hash.startsWith('#reset=')){const t=location.hash.slice(7);
 const p=prompt('Új jelszó (legalább 8 karakter):');location.hash='';
 if(p)fetch('/api/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:t,password:p})})
  .then(r=>r.json()).then(j=>{showLogin();say('#lok',j.ok?'A jelszó megváltozott, jelentkezzen be.':j.error)})}

async function start(){
 try{me=await api('/api/me')}catch(e){if(e.message!=='auth')authFatal('Bejelentkezés hiba: '+e.message);return}
 show('#login',false);show('#main',true);
 try{settings=await api('/api/settings')}catch(e){settings={colors:[],sound:1,beepSeconds:5};toast('A beállítások nem tölthetők be: '+e.message)}
 try{await loadYears()}catch(e){toast('Az évek nem tölthetők be: '+e.message)}
 route();
 es=new EventSource('/api/events');
 es.onmessage=async ev=>{const d=JSON.parse(ev.data);await loadYears();const cur=currentDay();if(d.date&&(d.date===cur))loadDay(cur,true)};
 es.onerror=()=>{toast('Kapcsolódás megszakadt, újrapróbálkozás…')};
 setInterval(()=>api('/api/heartbeat').catch(()=>{}),5*60*1000);
 startAlarmLoop();
}
async function loadYears(){const r=await api('/api/years');years=Array.isArray(r.years)&&r.years.length?r.years:[2027];counts=r.counts||{};notesC=r.notes||{};renderTree()}
function saveOpen(){localStorage.setItem('open',JSON.stringify(openState))}
function currentDay(){const m=location.hash.match(/^#\/(\d{4}-\d{2}-\d{2})$/);return m?m[1]:null}
function renderTree(){
 const cur=currentDay(),today=todayBp();
 if(cur){const[y,m]=cur.split('-');openState['y'+ +y]=true;openState['m'+ +y+'-'+ +m]=true}
 let h='';
 for(const y of years){
  h+=`<div class="yr ${openState['y'+y]?'open':''}" data-k="y${y}"><button><span class="arr">▶</span>${y}</button><div class="kids">`;
  for(let m=1;m<=12;m++){let mc=0,dh='';
   for(let d=1;d<=dim(y,m);d++){const s=iso(y,m,d),c=counts[s]||0,nc=notesC[s]||0;mc+=c;const w=dow(s);
    dh+=`<a class="day ${s===cur?'act':''} ${w===0||w===6?'we':''}" href="#/${s}"><span>${hu(s)} ${HU_D[w].slice(0,3)}${nc?' 📝':''}</span>${c?`<span class="n">${c}</span>`:''}</a>`}
   h+=`<div class="mo ${openState['m'+y+'-'+m]?'open':''}" data-k="m${y}-${m}"><button><span class="arr">▶</span>${HU_M[m-1]}${mc?` <span class="mini">(${mc})</span>`:''}</button><div class="kids days">${dh}</div></div>`}
  h+='</div></div>'}
 const tr=q('tree');if(!tr)return;tr.innerHTML=h;
 tr.querySelectorAll('.yr>button,.mo>button').forEach(b=>b.onclick=()=>{const p=b.parentElement;p.classList.toggle('open');openState[p.dataset.k]=p.classList.contains('open');saveOpen()});
 tr.querySelectorAll('a.day').forEach(a=>a.onclick=()=>{const n=$('#nav');if(n)n.classList.remove('show')});
}
window.onhashchange=()=>{renderTree();route()};
function route(){const d=currentDay();
 if(d)return loadDay(d);
 const h=location.hash;
 if(h==='#/search')return viewSearch();
 if(h==='#/notes')return viewNotes();
 if(h==='#/settings')return viewSettings();
 viewWelcome()}

/* ------------- napi oldal ------------- */
let dayItems=[];
function normalize(it){
 if(!it||typeof it!=='object')return {kind:'order',date:'',id:'',fields:{},history:[],notify:{on:false}};
 it.kind=it.kind==='note'?'note':'order';
 it.history=Array.isArray(it.history)?it.history:[];
 it.checked=!!it.checked;it.called=!!it.called;it.bold=!!it.bold;
 it.notify=it.notify&&typeof it.notify==='object'?Object.assign({on:false,hour:'',minute:'',note:''},it.notify):{on:false,hour:'',minute:'',note:''};
 const keys=['time','from','to','stops','passengers','payment','note','driver','colorId','company','orderedBy','orderedOn'];
 it.fields=it.fields&&typeof it.fields==='object'?it.fields:{};
 keys.forEach(k=>{const f=it.fields[k];it.fields[k]={value:String((f&&f.value)||''),modified:!!(f&&f.modified),history:String((f&&f.history)||'')}});
 if(!it.fields.time.value&&it.time&&it.kind==='order')it.fields.time.value=String(it.time);
 return it;
}
async function loadDay(date,silent){
 try{const raw=await api('/api/items?date='+date);dayItems=(Array.isArray(raw)?raw:[]).map(normalize)}catch(e){
  if(e.message==='auth')return;
  if(!silent){const ct=q('content');if(ct)ct.innerHTML='<div class="empty">Nem sikerült betölteni ('+esc(e.message)+').<br><br><button class="btn" onclick="location.reload()">Újrapróbálás</button></div>'}
  return}
 renderDay(date);
 queueAlarms(dayItems);
}
function renderDay(date){
 const[y,m,d]=date.split('-').map(Number);
 const prev=new Date(Date.UTC(y,m-1,d-1)).toISOString().slice(0,10),next=new Date(Date.UTC(y,m-1,d+1)).toISOString().slice(0,10);
 const topNotes=dayItems.filter(i=>i.kind==='note'&&!i.time);
 const rest=dayItems.filter(i=>!(i.kind==='note'&&!i.time)).sort((a,b)=>String(a.time||'99:99').localeCompare(String(b.time||'99:99')));
 let h=`<h2>${y}. ${HU_M[m-1].toLowerCase()} ${d}. – ${HU_D[dow(date)]}</h2>
 <p class="sub">${dayItems.filter(i=>i.kind==='order').length} rendelés · ${dayItems.filter(i=>i.kind==='note').length} megjegyzés · ${date}</p>
 <div class="bar"><button class="btn" id="newO">+ Új rendelés</button><button class="btn sec" id="newN">+ Megjegyzés</button>
 <span class="sp"></span><a class="btn sec sm" href="#/${prev}">‹ Előző nap</a><a class="btn sec sm" href="#/${next}">Következő nap ›</a></div>`;
 for(const n of topNotes)h+=noteTopHtml(n);
 h+='<div class="rows">';
 if(!rest.length)h+='<div class="empty">Erre a napra még nincs bejegyzés.<br><br>Kattintson az „+ Új rendelés” vagy a „+ Megjegyzés” gombra.</div>';

async function toggle(find,patch){
 const it=dayItems.find(find);if(!it)return;
 const elokep={};
 Object.keys(patch).forEach(k=>elokep[k]=it[k]);
 Object.assign(it,patch);
 renderDay(it.date);
 try{
  const friss=await api('/api/items/'+it.id,{method:'PUT',body:it});
  const i=dayItems.findIndex(x=>x.id===it.id);
  if(i>=0)dayItems[i]=normalize(friss);
  else Object.assign(it,patch);
  renderDay(it.date);loadYears();
 }catch(err){
  Object.keys(elokep).forEach(k=>it[k]=elokep[k]);
  renderDay(it.date);
  toast('Nem sikerült menteni: '+err.message,true);
 }
}

}

function bellMenu(it){
 it=normalize(it);
 const on=it.notify.on;
 modal(`<h3>🔔 Értesítés</h3><p class="sub">${hu(it.date)} ${esc(it.time||'')} ${esc((it.fields.from&&it.fields.from.value)||(it.fields.note&&it.fields.note.value)||'')}</p>
 <form id="bf"><label class="chk"><input type="checkbox" id="bon" ${on?'checked':''}> Jelezzen hangjelzéssel</label>
 <div class="grid2"><div class="field"><label>Ennyivel előtte – óra</label><select id="boh">${Array.from({length:13},(_,i)=>pad(i)).map(x=>`<option ${it.notify&&it.notify.hour===x?'selected':''}>${x}</option>`).join('')}</select></div>
 <div class="field"><label>perc</label><select id="bom">${['00','05','10','15','20','30','40','45','50'].map(x=>`<option ${it.notify&&it.notify.minute===x?'selected':''}>${x}</option>`).join('')}
 <option ${it.notify&&!/^(00|05|10|15|20|30|40|45|50)$/.test(it.notify.minute||'')?'selected':''}>${esc(it.notify&&it.notify.minute||'00')}</option></select></div></div>
 <div class="field"><label>Rövid szöveg a jelzéshez</label><input id="bnote" value="${esc(it.notify&&it.notify.note||'')}"></div>
 <div class="mact"><button type="button" class="btn sec" id="bc">Mégse</button><button class="btn">Mentés</button></div></form>`);
 $('#bc').onclick=closeModal;
 $('#bf').onsubmit=async e=>{e.preventDefault();
  const body={...it,notify:{on:isChecked('#bon'),hour:getVal('#boh'),minute:getVal('#bom'),note:getVal('#bnote')}};
  await api('/api/items/'+it.id,{method:'PUT',body});
  closeModal();toast('Értesítés mentve');loadDay(it.date,true)};
}
function queueAlarms(items){
 const t=nowBp();
 for(const it of items){
  if(!it.notify||!it.notify.on)continue;
  if(!it.time)continue;
  const [h,m]=it.time.split(':').map(Number);
  const when=new Date(t.getFullYear(),t.getMonth(),t.getDate(),h,m);
  const lead=(+it.notify.hour||0)*60+(+it.notify.minute||0);
  when.setMinutes(when.getMinutes()-lead);
  const key=it.id+'|'+it.date+'|'+it.time+'|'+lead;
  if(alarms[key])continue;
  if(when.getTime()<=t.getTime())continue;
  alarms[key]=true;
  const ms=when.getTime()-t.getTime();
  setTimeout(()=>fire(it),ms);
 }
}
function fire(it){
 const snd=settings.sound||1;
 const dur=settings.keepBeeping?15000:(settings.beepSeconds||5)*1000;
 try{beep(snd,dur)}catch(e){}
 toast('🔔 '+(it.notify.note||('Rendelés: '+hu(it.date)+' '+it.time)),true);
 if(Notification&&Notification.permission==='granted'){try{new Notification('Taxi rendelés',{body:(it.time||'')+' '+((it.fields.from&&it.fields.from.value)||'')})}catch(e){}}
}
function beep(which,ms){
 if(!beep.ctx)beep.ctx=new (window.AudioContext||window.webkitAudioContext)();
 const c=beep.ctx,o=c.createOscillator(),g=c.createGain();
 const f={1:[880,0],2:[660,0.35],3:[520,0.6],4:[990,0.15]}[which]||[880,0];
 o.type=which===3?'triangle':'sine';o.frequency.value=f[0];
 o.connect(g);g.connect(c.destination);g.gain.value=0.25;
 o.start();o.stop(c.currentTime+ms/1000);
 if(!settings.keepBeeping){ // rövid ismétlődő csipogás
  let n=0;const iv=setInterval(()=>{n++;if(n*400>ms){clearInterval(iv);return}
   const o2=c.createOscillator(),g2=c.createGain();o2.frequency.value=f[0];o2.connect(g2);g2.connect(c.destination);g2.gain.value=0.2;o2.start();o2.stop(c.currentTime+0.15)},400);
 }
}
function startAlarmLoop(){setInterval(()=>{const d=currentDay();if(d&&d===todayBp())queueAlarms(dayItems)},60000);
 if(Notification&&Notification.permission==='default')setTimeout(()=>Notification.requestPermission(),3000)}

 <div class="bar"><input id="q" placeholder="Keresett szó…" style="max-width:280px"><input type="date" id="qf" title="Ettől"><input type="date" id="qt" title="Eddig"><button class="btn" id="qb">Keresés</button></div><div id="qres"></div>`;
 const run=async()=>{
  const p=new URLSearchParams({q:getVal('#q')});
  const df=getVal('#qf'),dt2=getVal('#qt');
  if(df)p.set('from',df);
  if(dt2)p.set('to',dt2);
  const out=(await api('/api/search?'+p)||[]).map(normalize);
  const qr=q('qres');if(!qr)return;qr.innerHTML=out.length?`<p class="sub">${out.length} találat</p><table class="tbl"><tr><th>Nap</th><th>Idő</th><th>tx</th><th>Útvonal</th><th>Leadta / Cég</th><th>Utas</th><th>Fizetés</th></tr>
   ${out.map(o=>o.kind==='note'?`<tr><td>${hu(o.date)}</td><td>${esc(o.time||'—')}</td><td></td><td colspan="4">📝 ${esc(fx(o,'note').value)}</td></tr>`
   :`<tr><td><a href="#/${o.date}">${hu(o.date)}</a></td><td>${esc(o.time||'')}</td><td>${esc(fx(o,'driver').value)}</td><td>${esc(fx(o,'from').value)} → ${esc(fx(o,'to').value)}${fx(o,'stops').value?' → '+esc(fx(o,'stops').value):''}</td>
   <td>${esc(fx(o,'orderedBy').value)}${fx(o,'company').value?' · '+esc(fx(o,'company').value):''}</td><td>${esc(fx(o,'passengers').value)}</td><td>${esc(fx(o,'payment').value)}</td></tr>`).join('')}</table>`
   :'<div class="empty">Nincs találat.</div>';
 };
 const qb=q('qb');if(qb)qb.onclick=run;const qi=q('q');if(qi)qi.onkeydown=e=>{if(e.key==='Enter')run()};
 run();
}

async function viewSettings(){
 try{settings=await api('/api/settings')}catch(err){toast('A beállítások nem tölthetők be: '+err.message,true);return}
 if(!settings||typeof settings!=='object')settings={};
 if(!Array.isArray(settings.colors))settings.colors=[];
 settings.colors=settings.colors.map((c,i)=>({name:String((c&&c.name)||('Jelölés '+(i+1))),label:String((c&&c.label)||''),hex:(c&&/^#[0-9a-fA-F]{6}$/.test(c.hex||''))?c.hex:'#eeeeee'}));
 if(typeof settings.sound!=='number')settings.sound=1;
 if(typeof settings.beepSeconds!=='number')settings.beepSeconds=5;
 const ctG=q('content');if(!ctG)return;ctG.innerHTML=`<h2>⚙️ Beállítások</h2><p class="sub">Színek jelölése, értesítési hang.</p>
 <h3>Színek</h3><p class="mini">Minden sor egy jelölés: a neve, hogy mit jelöl, és maga a szín. A színt a színválasztóval vagy a kóddal is megadhatja.</p>
 <div id="cols">${settings.colors.map((c,i)=>`<div class="crow" style="display:grid;grid-template-columns:1fr 1fr auto auto;gap:8px;align-items:center;margin-bottom:6px">
  <input value="${esc(c.name||'')}" data-i="${i}" data-k="name" placeholder="Jelölés neve">
  <input value="${esc(c.label||'')}" data-i="${i}" data-k="label" placeholder="Mit jelöl? (pl. Módosulhat)">
  <span><input type="color" value="${/^#[0-9a-fA-F]{6}$/.test(c.hex||'')?c.hex:'#dbeafe'}" data-i="${i}" data-k="hex" style="width:44px;height:34px;padding:2px;vertical-align:middle"> <input value="${esc(c.hex||'')}" data-i="${i}" data-k="hex2" style="width:92px"></span>
  <button type="button" class="btn sec sm" data-delc="${i}">🗑️</button></div>`).join('')||'<p class="mini">Még nincs jelölés. Adjon hozzá a lenti gombbal.</p>'}</div>
 <div class="mact" style="justify-content:flex-start"><button class="btn sec sm" id="addC">+ Új szín</button><button class="btn sm" id="saveC">Színek mentése</button></div>
 <h3 style="margin-top:20px">Értesítési hang</h3>
 <div>${[1,2,3,4].map(s=>`<label class="chk"><input type="radio" name="snd" value="${s}" ${settings.sound===s?'checked':''}> ${s}. hang <button type="button" class="btn sec sm" data-play="${s}">▶ meghallgatás</button></label>`).join('')}</div>
 <h3 style="margin-top:20px">Jelzés hossza</h3>
 <label class="chk"><input type="radio" name="dur" value="short" ${!settings.keepBeeping?'checked':''}> Rövid jelzés <input type="number" id="secs" value="${settings.beepSeconds||5}" min="1" max="300" style="width:80px"> másodpercig</label>
 <label class="chk"><input type="radio" name="dur" value="keep" ${settings.keepBeeping?'checked':''}> Amíg le nem állítom</label>
 <h3 style="margin-top:20px">Fiók</h3>
 <p class="sub">${esc(me.name)} (${esc(me.username)})</p>
 <div class="mact" style="justify-content:flex-start"><button class="btn sec sm" id="pwBtn">Jelszó módosítása</button></div>`;
 const ac=q('addC');
 if(ac)ac.onclick=async()=>{
  try{
   const friss=await api('/api/settings');
   const cols=Array.isArray(friss.colors)?friss.colors.slice():[];
   cols.push({name:'Új jelölés '+(cols.length+1),label:'',hex:'#dbeafe'});
   settings=await api('/api/settings',{method:'PUT',body:{colors:cols}});
   toast('Új jelölés hozzáadva – nevezze el, majd mentse');
   viewSettings();
  }catch(err){toast('Nem sikerült hozzáadni: '+err.message,true)}
 };
 document.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>beep(+b.dataset.play,1500));
 document.querySelectorAll('[data-delc]').forEach(b=>b.onclick=async()=>{
  try{
   const friss=await api('/api/settings');
   const cols=(Array.isArray(friss.colors)?friss.colors:[]).filter((c,idx)=>idx!==+b.dataset.delc);
   if(!confirm('Törli ezt a jelölést? A rendeléseken a színezés megszűnik, az adatok megmaradnak.'))return;
   settings=await api('/api/settings',{method:'PUT',body:{colors:cols}});
   toast('Jelölés törölve');viewSettings();
  }catch(err){toast('Nem sikerült törölni: '+err.message,true)}
 });
 const sc=q('saveC');
 if(sc)sc.onclick=async()=>{
  try{
   const cols=(Array.isArray(settings.colors)?settings.colors:[]).map(c=>({name:c.name||'',label:c.label||'',hex:c.hex||''}));
   document.querySelectorAll('[data-i]').forEach(inp=>{
    const c=cols[+inp.dataset.i];if(!c)return;
    const k=inp.dataset.k;
    if(k==='hex2'){if(/^#[0-9a-fA-F]{6}$/.test(inp.value.trim()))c.hex=inp.value.trim();}
    else c[k]=inp.value;
   });
   const kesz=cols.map((c,i)=>({
    name:(c.name||'').trim()||('Jelölés '+(i+1)),
    label:(c.label||'').trim(),
    hex:/^#[0-9a-fA-F]{6}$/.test(c.hex||'')?c.hex:'#eeeeee'
   }));
   settings=await api('/api/settings',{method:'PUT',body:{colors:kesz}});
   toast('Színek mentve');viewSettings();
  }catch(err){toast('Nem sikerült menteni: '+err.message,true)}
 };
 document.querySelectorAll('input[name=snd]').forEach(r=>r.onchange=async()=>{try{settings=await api('/api/settings',{method:'PUT',body:{sound:+r.value}});toast('Hang mentve')}catch(e){toast('Nem sikerült menteni: '+e.message,true)}});
 document.querySelectorAll('input[name=dur]').forEach(r=>r.onchange=async()=>{try{settings=await api('/api/settings',{method:'PUT',body:{keepBeeping:r.value==='keep'}});toast('Mentve')}catch(e){toast('Nem sikerült menteni: '+e.message,true)}});

 $('#pwBtn').onclick=async()=>{const old=prompt('Jelenlegi jelszó:');if(!old)return;const nw=prompt('Új jelszó (min. 8 karakter):');if(!nw)return;
